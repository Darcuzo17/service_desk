{% extends "base.html" %}
{% block title %}Редактировать каталог{% endblock %}
{% block content %}
<div class="form-page">
  <div class="card form-shell">
    <div class="form-shell-header">
      <div class="form-shell-title">
        <h2>Редактирование записи</h2>
      </div>
      <div class="form-shell-meta">
        <span class="badge">{{ 'Услуга' if cat.catalog_type == 'service' else 'Категория' }}</span>
        <span class="badge">{{ 'Активна' if cat.is_active else 'Скрыта' }}</span>
      </div>
    </div>

    <div class="form-shell-body">
      <form method="post">
        <div class="form-sections">
          <section class="form-section">
            <div class="form-section-header">
              <h3>Основные данные</h3>
            </div>
            <div class="form-grid">
              <div class="form-field form-span-2">
                <label for="catalog_name">Название</label>
                <input id="catalog_name" name="catalog_name" value="{{ cat.catalog_name }}" required>
              </div>
              <div class="form-field form-span-2">
                <label for="catalog_description">Описание</label>
                <textarea id="catalog_description" name="catalog_description" class="form-textarea">{{ cat.catalog_description or '' }}</textarea>
              </div>
              <div class="form-field">
                <label for="parent_uid">Родительская категория</label>
                <select id="parent_uid" name="parent_uid">
                  <option value="">Без родителя</option>
                  {% for c in top_cats %}
                  <option value="{{ c.catalog_uid }}" {% if cat.parent_uid == c.catalog_uid %}selected{% endif %}>{{ c.catalog_name }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="form-field">
                <label for="work_group_uid">Рабочая группа</label>
                <select id="work_group_uid" name="work_group_uid">
                  <option value="">Не выбрана</option>
                  {% for wg in work_groups %}
                  <option value="{{ wg.work_group_uid }}" {% if cat.work_group_uid == wg.work_group_uid %}selected{% endif %}>{{ wg.group_name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>
          </section>

          <section class="form-section">
            <div class="form-section-header">
              <h3>Правила обработки</h3>
            </div>
            <div class="form-grid">
              <div class="form-field">
                <label for="ticket_type">Тип заявки</label>
                <select id="ticket_type" name="ticket_type">
                  <option value="service_request" {% if cat.ticket_type == 'service_request' %}selected{% endif %}>Запрос на обслуживание</option>
                  <option value="incident" {% if cat.ticket_type == 'incident' %}selected{% endif %}>Инцидент</option>
                </select>
              </div>
              <div class="form-field">
                <label for="priority">Приоритет</label>
                <select id="priority" name="priority">
                  <option value="low" {% if cat.priority == 'low' %}selected{% endif %}>Низкий</option>
                  <option value="medium" {% if cat.priority == 'medium' %}selected{% endif %}>Средний</option>
                  <option value="high" {% if cat.priority == 'high' %}selected{% endif %}>Высокий</option>
                  <option value="critical" {% if cat.priority == 'critical' %}selected{% endif %}>Критический</option>
                </select>
              </div>
              <div class="form-field form-span-2">
                <label for="sla_uid">SLA-политика</label>
                <select id="sla_uid" name="sla_uid">
                  <option value="">Без отдельной SLA-политики</option>
                  {% for s in slas %}
                  <option value="{{ s.sla_uid }}" {% if cat.sla_uid == s.sla_uid %}selected{% endif %}>{{ s.policy_name }}</option>
                  {% endfor %}
                </select>
              </div>
            </div>

            <div class="toggle-grid" style="margin-top: 14px;">
              <label class="toggle-card" for="approval_required">
                <div>
                  <strong>Требуется согласование</strong>
                  <p>Включайте, если заявку по этой услуге нельзя запускать без одобрения.</p>
                </div>
                <input id="approval_required" type="checkbox" name="approval_required" {% if cat.approval_required %}checked{% endif %}>
              </label>

              <label class="toggle-card" for="is_active">
                <div>
                  <strong>Запись активна</strong>
                  <p>Если выключить, запись останется в базе, но не будет доступна как обычная рабочая услуга.</p>
                </div>
                <input id="is_active" type="checkbox" name="is_active" {% if cat.is_active %}checked{% endif %}>
              </label>
            </div>
          </section>
        </div>

        <div class="form-shell-footer">
          <div class="form-shell-actions">
            <button class="btn btn-primary" type="submit">Сохранить изменения</button>
            <a class="btn" href="{{ url_for('admin_categories') }}">Назад</a>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
