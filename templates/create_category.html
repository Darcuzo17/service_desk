{% extends "base.html" %}
{% block title %}Создать категорию/услугу{% endblock %}
{% block content %}
<div class="card">
  <h2>Новая запись каталога</h2>
  <form method="post" class="grid grid-2">
    <label for="catalog_name">Название каталога:</label><input name="catalog_name" required>
    <label for="catalog_icon">Иконка каталога:</label><input name="catalog_icon" value="briefcase">
    <label for="catalog_description">Описание каталога:</label><textarea name="catalog_description"></textarea>
    <label for="work_group_uid">Рабочая группа:</label><select name="work_group_uid">
      <option value=""></option>{% for wg in work_groups %}<option value="{{ wg.work_group_uid }}">{{
        wg.group_name }}</option>{% endfor %}
    </select>
    <label for="parent_uid">Родительская категория (верхний уровень):</label><select name="parent_uid">
      <option value=""></option>{% for c in top_cats %}<option value="{{ c.catalog_uid }}">Услуга внутри: {{
        c.catalog_name }}</option>{% endfor %}
    </select>
    <label for="ticket_type">Тип заявки:</label><select name="ticket_type">
      <option value="service_request">Запрос на обслуживание</option>
      <option value="incident">Инцидент</option>
    </select>
    <label for="priority">Приоритет:</label><select name="priority">
      <option value="low">Низкий</option>
      <option value="medium" selected>Средний</option>
      <option value="high">Высокий</option>
      <option value="critical">Критический</option>
    </select>
    <label for="sla_uid">SLA-политика:</label><select name="sla_uid">
      <option value=""></option>{% for s in slas %}<option value="{{ s.sla_uid }}">{{ s.policy_name }}
      </option>{% endfor %}
    </select>
    <label> Требует согласования</label><input type="checkbox" name="approval_required">
    <div></div>
    <div></div>
    <div class="actions"><button class="btn btn-primary" type="submit">Сохранить</button><a class="btn"
        href="{{ url_for('admin_categories') }}">Назад</a></div>
  </form>
</div>
{% endblock %}
