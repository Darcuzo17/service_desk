{% extends "base.html" %}
{% block title %}Создать пользователя{% endblock %}
{% block content %}
<div class="card">
  <h2>Новый пользователь</h2>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  {% if success %}
  <div class="flash flash-success">Пользователь создан. Логин: <b>{{ temp_login }}</b>, временный пароль: <b>{{
      temp_password }}</b></div>
  {% endif %}
  <form method="post" class="grid grid-2">
    <label for="last_name">Фамилия:</label><input name="last_name" required>
    <label for="last_name">Имя:</label><input name="first_name" required>
    <label for="last_name">Отчество:</label><input name="middle_name" required>
    <label for="last_name">Email:</label><input type="email" name="email" required>
    <label for="last_name">Мобильный:</label><input name="mobile" required>
    <label for="last_name">Рабочий телефон:</label><input name="work_phone" required>
    <label for="last_name">Должность:</label><input name="title" required>
    <label for="last_name">Отдел:</label><input name="department" required>
    <label for="last_name">Компания:</label><input name="company" required>
    <label for="last_name">Пол:</label><select name="gender">
      <option value="male">Мужской</option>
      <option value="female">Женский</option>
    </select>
    <label for="last_name">Роль:</label><select name="role">
      <option value="user">Пользователь</option>
      <option value="specialist">Специалист</option>
      <option value="manager">Менеджер</option>
      <option value="admin">Администратор</option>
    </select>
    <label for="last_name">Рабочая группа:</label><select name="work_group_uid">
      <option value=""></option>{% for wg in work_groups %}<option value="{{ wg.work_group_uid }}">{{
        wg.group_name }}</option>{% endfor %}
    </select>
    <label for="last_name">Руководитель:</label><select name="manager_uid">
      <option value=""></option>{% for u in all_users %}<option value="{{ u.user_uid }}">{{ u.full_name() }}
      </option>{% endfor %}
    </select>
    <div></div>
    <div></div>
    <div class="actions"><button class="btn btn-primary" type="submit">Создать</button><a class="btn"
        href="{{ url_for('admin_users') }}">Назад</a></div>
  </form>
</div>
{% endblock %}
